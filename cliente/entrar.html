<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — Área do cliente</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#fbf6f1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/elegance.css">
  <link rel="stylesheet" href="../sistema/css/sistema.css">
  <script src="../sistema/js/config.js"></script>
  <script src="../js/content.js"></script>
  <script src="../js/palettes.js"></script>
  <script src="../js/color-utils.js"></script>
  <script src="../js/theme-engine.js"></script>
  <script>PS.theme.init();</script>
</head>
<body class="elegance" data-area="acesso" data-page="entrar" data-raiz="../">
<template data-conteudo>

  <div class="auth__card">
    <p class="auth__kicker">Área do cliente</p>
    <h1>Entrar</h1>
    <p class="muted">Acompanhe, cancele ou reagende seus horários.</p>
    <div class="demo-accounts" data-demo-contas hidden></div>
    <p class="alert" data-msg hidden role="alert"></p>
    <form class="form" data-form novalidate>
      <div class="field"><label class="field__label" for="email">E-mail</label>
        <input class="input" id="email" type="email" autocomplete="email" required inputmode="email" aria-describedby="email-e">
        <p class="field__error" id="email-e" hidden></p></div>
      <div class="field"><label class="field__label" for="senha">Senha</label>
        <div class="password-wrap"><input class="input" id="senha" type="password" autocomplete="current-password" required minlength="8" aria-describedby="senha-e">
        <button type="button" class="password-toggle" data-toggle-senha aria-pressed="false" aria-label="Mostrar senha">Mostrar</button></div>
        <p class="field__error" id="senha-e" hidden></p></div>
      <button class="btn btn--primary btn--block" type="submit" data-enviar>Entrar</button>
    </form>
    <div class="auth__links">
      <a href="recuperar-senha.html">Esqueci minha senha</a>
      <span>Ainda não tem conta? <a href="cadastro.html" data-link-cadastro>Criar conta</a></span>
      <a href="../admin/entrar.html">Sou a podóloga: acessar a área administrativa</a>
    </div>
  </div>
</template>
<noscript><p style="padding:1rem">Esta área precisa de JavaScript ativado.</p></noscript>
<script src="../sistema/js/tempo.js"></script>
<script src="../sistema/js/disponibilidade.js"></script>
<script src="../sistema/js/dados-demo.js"></script>
<script src="../sistema/js/api-demo.js"></script>
<script src="../sistema/js/api-supabase.js"></script>
<script src="../sistema/js/api.js"></script>
<script src="../sistema/js/ui.js"></script>
<script src="../sistema/js/icones.js"></script>
<script src="../sistema/js/layout-app.js"></script>
<script src="../js/palette-switcher.js"></script>
<script src="../sistema/js/cliente.js"></script>
</body>
</html>
