<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recuperar senha</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#fbf6f1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/elegance.css">
  <link rel="stylesheet" href="../sistema/css/sistema.css">
  <script src="../sistema/js/config.js"></script>

  <script src="../js/palettes.js"></script>

  <script>PS.theme.init();</script>
</head>
<body class="elegance" data-area="acesso" data-page="recuperar" data-raiz="../">
<template data-conteudo>

  <div class="auth__card">
    <p class="auth__kicker">Recuperar acesso</p>
    <h1>Esqueci minha senha</h1>
    <p class="muted">Informe o e-mail da sua conta. Enviaremos um link para você criar uma nova senha.</p>
    <p class="alert" data-msg hidden role="status"></p>
    <p class="demo-accounts" data-demo-link hidden></p>
    <form class="form" data-form novalidate>
      <div class="field"><label class="field__label" for="email">E-mail</label>
        <input class="input" id="email" type="email" autocomplete="email" required inputmode="email" aria-describedby="email-e">
        <p class="field__error" id="email-e" hidden></p></div>
      <button class="btn btn--primary btn--block" type="submit" data-enviar>Enviar link</button>
    </form>
    <div class="auth__links"><a href="entrar.html">Voltar para Entrar (cliente)</a><a href="../admin/entrar.html">Voltar para a Área da podóloga</a></div>
  </div>
</template>
<noscript><p style="padding:1rem">Esta área precisa de JavaScript ativado.</p></noscript>
<script src="../sistema/js/tempo.js"></script>
<script src="../sistema/js/disponibilidade.js"></script>
<script src="../sistema/js/dados-demo.js"></script>

<script src="../sistema/js/layout-app.js"></script>
<script src="../js/palette-switcher.js"></script>
<script src="../sistema/js/cliente.js"></script>
</body>
</html>
