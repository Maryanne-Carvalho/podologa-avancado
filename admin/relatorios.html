<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relatórios — Área da podóloga</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#fbf6f1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/elegance.css">
  <link rel="stylesheet" href="../sistema/css/sistema.css">
  <script src="../sistema/js/config.js"></script>
  <script src="../js/content.js"></script>
  <script src="../js/palettes.js"></script>
  <script src="../js/color-utils.js"></script>
  <script src="../js/theme-engine.js"></script>
  <script>PS.theme.init();</script>
</head>
<body class="elegance" data-area="admin" data-page="relatorios" data-raiz="../">
<template data-conteudo>

  <div class="page-head"><div class="page-head__text"><h1>Relatórios</h1><p>Calculados a partir dos agendamentos do período escolhido.</p></div></div>
  <p class="alert alert--info" data-demo hidden style="margin-bottom:1.25rem">Relatórios calculados com os dados fictícios da demonstração. Não representam uma clínica real.</p>
  <form class="panel" data-form novalidate style="margin-bottom:1.25rem">
    <div class="form-grid" style="align-items:end">
      <div class="field"><label class="field__label" for="de">De</label><input class="input" type="date" id="de" required></div>
      <div class="field"><label class="field__label" for="ate">Até</label><input class="input" type="date" id="ate" required></div>
    </div>
    <div class="actions-row" style="margin-top:1rem">
      <button type="button" class="btn btn--outline btn--xs" data-preset="mes">Este mês</button>
      <button type="button" class="btn btn--outline btn--xs" data-preset="anterior">Mês passado</button>
      <button type="button" class="btn btn--outline btn--xs" data-preset="90">Últimos 90 dias</button>
      <button type="button" class="btn btn--outline btn--xs" data-preset="ano">Este ano</button>
      <button type="submit" class="btn btn--primary btn--sm">Gerar relatório</button>
    </div>
    <p class="alert" data-msg hidden style="margin-top:1rem"></p>
  </form>
  <div data-resultado></div>
  <div class="grid-2" style="margin-top:1.25rem">
    <section class="panel" aria-labelledby="h-prox"><h2 id="h-prox" style="margin-bottom:1rem">Próximos atendimentos (14 dias)</h2><div data-proximos></div></section>
    <section class="panel" aria-labelledby="h-hp"><h2 id="h-hp" style="margin-bottom:1rem">Histórico por paciente</h2>
      <label class="sr-only" for="pac">Paciente</label><select class="select" id="pac"><option value="">Carregando…</option></select><div data-hist style="margin-top:1rem"></div></section>
  </div>
</template>
<noscript><p style="padding:1rem">Esta área precisa de JavaScript ativado.</p></noscript>
<script src="../sistema/js/tempo.js"></script>
<script src="../sistema/js/disponibilidade.js"></script>
<script src="../sistema/js/dados-demo.js"></script>
<script src="../sistema/js/api-demo.js"></script>
<script src="../sistema/js/api-supabase.js"></script>
<script src="../sistema/js/api.js"></script>
<script src="../sistema/js/ui.js"></script>
<script src="../sistema/js/icones.js"></script>
<script src="../sistema/js/layout-app.js"></script>
<script src="../js/palette-switcher.js"></script>
<script src="../sistema/js/seletor-horario.js"></script>
<script src="../sistema/js/admin-comum.js"></script>
<script src="../sistema/js/admin-relatorios.js"></script>
</body>
</html>
