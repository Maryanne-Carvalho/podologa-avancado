<body class="elegance" data-area="admin" data-page="pacientes" data-raiz="../">
<template data-conteudo>

  <div class="page-head"><div class="page-head__text"><h1>Pacientes</h1><p data-total></p></div>
    <div class="page-head__actions"><button type="button" class="btn btn--primary" data-novo-paciente><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>Cadastrar paciente</button></div></div>
  <div class="grid-2">
    <section class="panel" aria-label="Lista de pacientes">
      <div class="search" style="margin-bottom:1rem"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg><input class="input" type="search" placeholder="Buscar por nome ou telefone" aria-label="Buscar paciente" data-q autocomplete="off"></div>
      <div class="pat-list" data-lista><p class="loading"><span class="spinner"></span>Carregando…</p></div>
    </section>
    <section class="panel" aria-label="Detalhes do paciente" data-detalhe><div class="empty">Escolha um paciente na lista para ver contato, histórico e anotações.</div></section>
  </div>
</template>
